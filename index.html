<!doctype html>

<html lang="ja">
  
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#10231d">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <title>MY MONEY</title></head><body><header>
      <b>
        MY MONEY
      </b>
      
      <span>
        あなたのお金を見える化
      </span>
      
      <button id="logout" hidden>
        ログアウト
      </button>
    </header>
      
      <main>
        <section id="login" class="panel">
          <h1>
            ログイン
          </h1>
          
          <form id="loginForm">
            <label>
              メールアドレス
              <input id="email" type="email" required>
            </label>
            
            <label>
              パスワード
              <input id="password" type="password" required>
            </label>
            
            <button>
              ログイン
            </button>
            
            <p id="loginError" class="error">
              
            </p>
          </form>
        </section>
        
        <section id="app" hidden>
          <nav>
            <button data-tab="home">
              ホーム
            </button>
            
            <button data-tab="transactions">
              収支
            </button>
            
            <button data-tab="debts">
              借入
            </button>
            
            <button data-tab="savings">
              貯金
            </button>
          </nav>
          
<section id="home" class="view">

  <label class="month-select">
    表示月
    <input id="month" type="month">
  </label>

  <div class="grid">

    <article class="wide">
      <span class="card-icon">◆</span>
      <span>今月の収支</span>
      <strong id="balance">¥0</strong>
      <small>今月の収入 − 支出</small>
    </article>

    <article>
      <span class="card-icon">↗</span>
      <span>収入</span>
      <strong id="income">¥0</strong>
    </article>

    <article>
      <span class="card-icon">↘</span>
      <span>支出</span>
      <strong id="expense">¥0</strong>
    </article>

  </div>

  <section class="panel debt-summary">
    <span class="card-icon">◇</span>
    <h2>借入残高合計</h2>
    <strong id="debtTotal">¥0</strong>
    <p>登録している借入の合計残高</p>
  </section>

<section class="panel home-savings">
  <h2>貯金の進捗</h2>
  <div id="homeSavings">
    貯金目標はまだ登録されていません
  </div>
</section>

<section class="panel monthly-chart">
  <h2>月別収支グラフ</h2>
  <p>過去6か月の収入と支出</p>

  <div id="monthChart">
    グラフを読み込んでいます
  </div>
</section>  
  
  <section class="panel recent-records">

    
    
    <h2>最近の記録</h2>
    <div id="recent"></div>
  </section>

</section>
          
</section>
    
<section id="transactions" class="view" hidden>
  <section class="panel">
    <h2>
      収入・支出を登録
    </h2>
    
    <form id="txForm">
      <label>
        種類
        <select id="type">
          <option value="expense">
            支出
          </option>
          
          <option value="income">
            収入
          </option>
        </select>
      </label>
      
<label>
  日付
  <input id="date" type="date" required>
</label>
      
<label>
  金額（円）
  <input id="amount" type="number" min="1" required>
</label>
      
<label>
  カテゴリ
  <input id="category" required placeholder="食費・給与など">
</label>
      
<label>
  メモ
  <input id="memo">
</label>
      
<button>
  保存
</button>
      
<p id="txError" class="error">
  
</p>
</form>
</section>
  
<section class="panel">
  <h2>
    記録一覧
  </h2>
  
  <div id="txList">
    
  </div>
</section>
</section>
        
<section id="debts" class="view" hidden><section class="panel">
  
  <h2>
    
    借入先を登録
  </h2>
  
<form id="debtForm">
  <label>
    借入先
    <input id="debtName" required>
  </label>
  
<label>
  現在残高（円）
  <input id="debtBalance" type="number" min="0" required>
</label>
  
<label>
  年利（%）
  <input id="debtRate" type="number" min="0" max="100" step=".01" required>
</label>
  
<label>
  毎月の返済額（円）
  <input id="debtPayment" type="number" min="0" required>
</label>

<button>
  保存
</button>
  
<p id="debtError" class="error">
  
</p>
</form>
</section>
  
<section class="panel">
  <h2>
    借入一覧
  </h2>
  <div id="debtList">
    
  </div>
</section>
</section>
        
<section id="savings" class="view" hidden>
  <section class="panel">
    <h2>
      貯金目標
    </h2>
    
<form id="savingForm">
  <label>
    目標名
    <input id="savingName" required>
  </label>
  
  <label>
    目標金額（円）
    <input id="goal" type="number" min="1" required>
  </label>
  
  <label>
    現在の貯金額（円）
    <input id="current" type="number" min="0" required>
  </label>
  
  <button>
    保存
  </button>
  
  <p id="savingError" class="error">
      </p>
</form>
  </section>
  
  <section class="panel">
    <h2>
      目標一覧
    </h2>
    
    <div id="savingList">
      
    </div>
  </section>
</section>
      </section>
      </main>

<footer>
  MY MONEY · 個人用
  </footer>
      
<script type="module" src="app.js">
  
</script>
    </body>
</html>
